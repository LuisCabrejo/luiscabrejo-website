<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ley 2: Multiplicación | Luis Cabrejo</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #1a252f;
            --linear-color: #3498db;
            --exp-color: #9b59b6; /* Morado para lo exponencial */
        }
        body {
            background-color: var(--bg-color);
            color: white;
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .hud-top { position: absolute; top: 20px; text-align: center; }
        .hud-title { font-size: 2.5rem; text-transform: uppercase; text-shadow: 0 0 20px rgba(155, 89, 182, 0.5); }

        #network-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            margin-top: 20px;
        }

        .person {
            position: absolute;
            width: 12px; height: 12px;
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            animation: popIn 0.4s forwards;
            z-index: 2;
        }
        @keyframes popIn { to { transform: translate(-50%, -50%) scale(1); } }

        .connection {
            position: absolute;
            height: 1px;
            background: rgba(255,255,255,0.3);
            transform-origin: 0 50%;
            z-index: 1;
        }

        .stats {
            position: absolute; bottom: 20px; left: 20px;
            font-family: 'Roboto Mono', monospace; font-size: 1.2rem;
        }

        .controls { margin-top: 30px; display: flex; gap: 20px; }
        .btn {
            background: transparent; border: 2px solid #555; color: #777;
            padding: 15px 30px; font-family: 'Roboto Mono', monospace; font-size: 1rem;
            cursor: pointer; text-transform: uppercase;
        }
        .btn.active { border-color: var(--exp-color); color: var(--exp-color); box-shadow: 0 0 15px rgba(155, 89, 182, 0.4); }

    </style>
</head>
<body>

    <div class="hud-top">
        <h1 class="hud-title">LEY 2: ENSEÑAR A ENSEÑAR</h1>
        <div style="color: #95a5a6; font-family: 'Roboto Mono';">SUMA VS. MULTIPLICACIÓN</div>
    </div>

    <div id="network-container">
        <div class="person" style="top:50%; left:50%; background: white; width: 16px; height: 16px;"></div>
    </div>

    <div class="stats">
        SOCIOS: <span id="count" style="color: var(--exp-color); font-weight: bold;">1</span>
    </div>

    <div class="controls">
        <button class="btn" onclick="reset()">REINICIAR</button>
        <button class="btn" onclick="addOne()">SUMAR (+1)</button>
        <button class="btn active" onclick="triggerExponential()">ENSEÑAR A ENSEÑAR (x2)</button>
    </div>

    <script>
        const container = document.getElementById('network-container');
        const countDisplay = document.getElementById('count');
        let nodes = [{x: 400, y: 250}]; // Centro
        let count = 1;

        function reset() {
            container.innerHTML = '<div class="person" style="top:50%; left:50%; background: white; width: 16px; height: 16px;"></div>';
            nodes = [{x: 400, y: 250}];
            count = 1;
            countDisplay.innerText = count;
        }

        function createNode(parentX, parentY, color) {
            const el = document.createElement('div');
            el.classList.add('person');

            // Posición aleatoria cerca del padre
            const angle = Math.random() * Math.PI * 2;
            const dist = 30 + Math.random() * 50;
            const x = parentX + Math.cos(angle) * dist;
            const y = parentY + Math.sin(angle) * dist;

            // Evitar salir del cuadro
            if(x < 10 || x > 790 || y < 10 || y > 490) return null;

            el.style.left = x + 'px';
            el.style.top = y + 'px';
            el.style.backgroundColor = color;

            // Línea conectora
            const line = document.createElement('div');
            line.classList.add('connection');
            const len = Math.sqrt(Math.pow(x - parentX, 2) + Math.pow(y - parentY, 2));
            const angleDeg = Math.atan2(y - parentY, x - parentX) * 180 / Math.PI;

            line.style.width = len + 'px';
            line.style.left = parentX + 'px';
            line.style.top = parentY + 'px';
            line.style.transform = `rotate(${angleDeg}deg)`;

            container.appendChild(line);
            container.appendChild(el);

            return {x, y};
        }

        function addOne() {
            // Solo agrega conectado al nodo central (Suma)
            const newNode = createNode(400, 250, 'var(--linear-color)');
            if(newNode) {
                count++;
                countDisplay.innerText = count;
            }
        }

        function triggerExponential() {
            // Cada nodo existente intenta crear un nuevo nodo (Multiplicación)
            // Limitamos para no colapsar el navegador
            if (count > 300) return;

            const currentNodes = [...nodes];
            currentNodes.forEach((parent, i) => {
                // Pequeño delay para efecto visual de cascada
                setTimeout(() => {
                    const newNode = createNode(parent.x, parent.y, 'var(--exp-color)');
                    if (newNode) {
                        nodes.push(newNode);
                        count++;
                        countDisplay.innerText = count;
                    }
                }, i * 10);
            });
        }
    </script>
</body>
</html>
